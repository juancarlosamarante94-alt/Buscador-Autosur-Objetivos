name: Validar y preparar Autosur Objetivos
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar release después de validar
        required: true
        default: false
        type: boolean
  push:
    branches: [main, objetivos]
permissions:
  contents: read
jobs:
  validar:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auditar repositorio sin bases DAT
        shell: pwsh
        run: |
          $tracked = @(git ls-files | Where-Object { $_ -match '(?i)\.dat$' })
          $historical = @(git rev-list --objects --all | Where-Object { $_ -match '(?i)\.dat$' })
          if ($tracked.Count -gt 0 -or $historical.Count -gt 0) { throw 'Se detectaron DAT en el repositorio o su historial' }
          Write-Output 'OK repositorio e historial sin archivos DAT'
      - name: Reconstruir dependencias y compilar
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'Buscador_VIN_Instalable'
          foreach ($name in @('UglyToad.PdfPig.Fonts.dll','UglyToad.PdfPig.dll')) {
            $out = [IO.File]::Create((Join-Path $root "lib/$name"))
            try { Get-ChildItem "binary-parts/$name.*" | Sort-Object Name | ForEach-Object { $bytes = [IO.File]::ReadAllBytes($_.FullName); $out.Write($bytes,0,$bytes.Length) } } finally { $out.Dispose() }
          }
          if ((git hash-object "$root/lib/UglyToad.PdfPig.Fonts.dll") -ne '2e1b9817fdef5820a9c5e59d09ee8ec0cc2c079d') { throw 'Fonts DLL inválida' }
          if ((git hash-object "$root/lib/UglyToad.PdfPig.dll") -ne '3c6a850a2bab06cc534ea7ba168b59b895243254') { throw 'PdfPig DLL inválida' }
          $compiler = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          $refs = @('System.dll','System.Core.dll','System.Drawing.dll','System.Windows.Forms.dll','System.Xml.dll','System.Xml.Linq.dll','System.IO.Compression.dll','System.IO.Compression.FileSystem.dll','System.Web.Extensions.dll','System.Security.dll') + @(Get-ChildItem "$root/lib/*.dll" | ForEach-Object FullName)
          $argsRef = $refs | ForEach-Object { '/reference:' + $_ }
          & $compiler /nologo /target:winexe "/out:$root\Buscador Autosur Objetivos.exe" @argsRef "$root\BuscadorVIN.cs" "$root\Turnero.cs" "$root\ObjetivosCore.cs" "$root\Objetivos.cs" "$root\Actualizaciones.cs"
          if ($LASTEXITCODE -ne 0) { throw 'Error al compilar aplicación' }
          & $compiler /nologo /out:Tests.exe /reference:System.Core.dll /reference:System.Xml.dll /reference:System.Xml.Linq.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll "$root\ObjetivosCore.cs" (Join-Path $PWD 'tests\CoreTests.cs')
          if ($LASTEXITCODE -ne 0) { throw 'Error al compilar pruebas' }
          ./Tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron pruebas' }
          & $compiler /nologo /main:UiSmoke /out:UiSmoke.exe @argsRef "$root\BuscadorVIN.cs" "$root\Turnero.cs" "$root\ObjetivosCore.cs" "$root\Objetivos.cs" "$root\Actualizaciones.cs" (Join-Path $PWD 'tests\UiSmoke.cs')
          if ($LASTEXITCODE -ne 0) { throw 'Error al compilar prueba visual' }
          Get-ChildItem "$root/lib/*.dll" | Copy-Item -Destination .
          ./UiSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'Error al abrir dashboard WinForms' }
          $preview = [Convert]::ToBase64String([IO.File]::ReadAllBytes('dashboard-verificado.png'))
          for ($i=0; $i -lt $preview.Length; $i+=4000) { Write-Output ('UI_PREVIEW_BASE64:' + $preview.Substring($i,[Math]::Min(4000,$preview.Length-$i))) }
          & $compiler /nologo /main:TurneroTests /out:TurneroTests.exe @argsRef "$root\BuscadorVIN.cs" "$root\Turnero.cs" "$root\ObjetivosCore.cs" "$root\Objetivos.cs" "$root\Actualizaciones.cs" tests\TurneroTests.cs
          if ($LASTEXITCODE -ne 0) { throw 'Error al compilar pruebas del turnero' }
          ./TurneroTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron navegación e impresión del turnero' }
          foreach ($imageFile in @('turnero-pantalla.png','turnero-impresion.png','turnero-vista-previa.png')) {
            $turnPreview = [Convert]::ToBase64String([IO.File]::ReadAllBytes($imageFile))
            Write-Output ('TURNERO_IMAGE:' + $imageFile)
            for ($i=0; $i -lt $turnPreview.Length; $i+=4000) { Write-Output ('TURNERO_BASE64:' + $turnPreview.Substring($i,[Math]::Min(4000,$turnPreview.Length-$i))) }
          }
          & $compiler /nologo /main:UpdateTests /out:UpdateTests.exe @argsRef "$root\Actualizaciones.cs" tests\UpdateTests.cs
          if ($LASTEXITCODE -ne 0) { throw 'Error al compilar pruebas de actualización' }
          ./UpdateTests.exe --public-live
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron pruebas de actualización' }
          $version = [regex]::Match((Get-Content -Raw "$root\Actualizaciones.cs"), 'AppVersion="([0-9.]+)"').Groups[1].Value
          if (!$version) { throw 'Falta versión' }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Crear paquete
        shell: pwsh
        run: |
          if (@(Get-ChildItem Buscador_VIN_Instalable -Recurse -File -Filter '*.dat').Count -gt 0) { throw 'No publicar bases DAT' }
          Compress-Archive Buscador_VIN_Instalable Buscador_Autosur_Objetivos_Actualizacion.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'Buscador_Autosur_Objetivos_Actualizacion.zip'))
          try { if (@($package.Entries | Where-Object { $_.FullName -match '(?i)\.dat$' }).Count -gt 0) { throw 'El paquete contiene DAT' } } finally { $package.Dispose() }
          Write-Output 'OK paquete final sin DAT'
      - uses: actions/upload-artifact@v4
        with:
          name: Buscador-Autosur-Objetivos
          path: |
            Buscador_Autosur_Objetivos_Actualizacion.zip
            dashboard-verificado.png
            dashboard-compacto.png
            turnero-pantalla.png
            turnero-impresion.png
            turnero-vista-previa.png
      - uses: softprops/action-gh-release@v2
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
        with:
          tag_name: v${{ env.VERSION }}
          name: Buscador Autosur Objetivos v${{ env.VERSION }}
          files: |
            Buscador_Autosur_Objetivos_Actualizacion.zip
            dashboard-verificado.png
            dashboard-compacto.png
            turnero-pantalla.png
            turnero-impresion.png
            turnero-vista-previa.png
          body: |
            Autosur Objetivos 1.3.6: corrección de lectura y vista previa del turnero.
            - Vista previa independiente: Cerrar vista previa, Esc, páginas y zoom sin bloquear la app.
            - Columnas detectadas por sus encabezados; se eliminan recortes fijos de nombres y servicios.
            - Conserva teléfonos, nombres completos, importes y notas de servicio; distingue CUIT de teléfono.
            - Reconoce turnos por horario y conserva continuaciones entre páginas; excluye Nissan y horarios vacíos.
            - Mantiene A4 vertical, alto de turno ajustable y actualización sin credenciales.
            Validado en Windows, incluido un PDF sintético con escalas distintas y datos de prueba.
            Paquete sin DAT. Conserva bases locales, historial y objetivos.
          generate_release_notes: true
